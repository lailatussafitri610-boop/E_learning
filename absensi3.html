<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi - E-Learning SMA</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;background:#f5f6f8;color:#222}.app{max-width:500px;min-height:100vh;margin:auto;background:#fff;padding-bottom:30px}header{background:#1f2937;color:#fff;padding:20px}header a{color:#fff;text-decoration:none;font-size:16px}header h1{margin-top:20px;font-size:25px}header p{margin-top:8px;color:#d1d5db}.content{padding:20px}.info{background:#f9fafb;border:1px solid #ddd;border-radius:12px;padding:15px;margin-bottom:20px}.info p{margin-bottom:7px;line-height:1.5}.info p:last-child{margin-bottom:0}.form-group{margin-bottom:20px}.form-group label.title{display:block;font-weight:700;margin-bottom:8px}input[type=text]{width:100%;padding:14px;border:1px solid #ccc;border-radius:9px;font-size:16px}.status-option{display:flex;align-items:center;border:1px solid #ddd;border-radius:10px;padding:14px;margin-bottom:10px;cursor:pointer}.status-option input{margin-right:12px;width:18px;height:18px}.status-option:hover{background:#f9fafb}.button{width:100%;border:none;background:#1f2937;color:#fff;padding:14px;border-radius:9px;font-weight:700;font-size:16px;cursor:pointer}.button:hover{background:#111827}.message{display:none;background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;padding:15px;border-radius:10px;margin-top:20px;line-height:1.5}.back-button{display:block;width:100%;background:#3b7fa8;color:#fff;text-align:center;text-decoration:none;padding:14px;border-radius:9px;font-weight:700;margin-top:15px}.back-button:hover{background:#285b7b}
    </style>
    <style id="fifi-theme-embedded">
        :root{--fifi-blue-950:#214a67;--fifi-blue-900:#285b7b;--fifi-blue-700:#3b7fa8;--fifi-blue-100:#eaf4fb;--fifi-blue-50:#f8fcff;--fifi-ink:#203b52;--fifi-line:#d8e9f5}body{background-color:var(--fifi-blue-100)!important;color:var(--fifi-ink)}.app{background-color:var(--fifi-blue-50)!important}header{background-color:var(--fifi-blue-900)!important;color:#fff!important}header h1,header h2,header p{color:inherit}.info{border-color:var(--fifi-line)}.button,button,.back-button{background-color:var(--fifi-blue-700);border-color:var(--fifi-blue-700);color:#fff}.button:hover,button:hover,.back-button:hover{background-color:var(--fifi-blue-900);border-color:var(--fifi-blue-900)}.fifi-hero{position:relative;display:flex;align-items:center;justify-content:space-between;min-height:122px;overflow:hidden;margin:14px 20px 18px;padding:16px 18px;border:1px solid #cfe4f2;border-radius:16px;background:linear-gradient(125deg,#e5f3fb,#f7fcff 60%,#d9edf9);color:var(--fifi-blue-950)}.fifi-hero-copy{max-width:calc(100% - 108px)}.fifi-hero-title{display:block;margin:0 0 6px;color:var(--fifi-blue-900);font-size:13px;font-weight:800;letter-spacing:.07em}.fifi-hero-copy p{margin:0;color:#58758a;font-size:13px;line-height:1.5}.fifi-hero-art{position:relative;display:grid;width:94px;height:86px;flex:0 0 94px;place-items:center;pointer-events:none}.fifi-orb{position:absolute;width:70px;height:70px;border:1px solid rgba(85,152,197,.25);border-radius:50%;background:rgba(255,255,255,.75);box-shadow:0 8px 20px rgba(58,119,157,.12)}.fifi-icon{position:relative;font-size:43px;line-height:1;filter:drop-shadow(0 4px 3px rgba(47,99,131,.15));animation:fifi-float 3.6s ease-in-out infinite}.fifi-badge{position:absolute;right:4px;bottom:4px;display:grid;width:26px;height:26px;place-items:center;border:2px solid #fff;border-radius:50%;background:#e4f5eb;color:#33895d;font-size:15px;font-weight:800}.fifi-sparkle{position:absolute;top:4px;left:4px;color:#66a5ca;font-size:16px;animation:fifi-twinkle 2.8s ease-in-out infinite}@keyframes fifi-float{0%,100%{transform:translateY(1px)}50%{transform:translateY(-4px)}}@keyframes fifi-twinkle{0%,100%{opacity:.5;transform:scale(.9)}50%{opacity:1;transform:scale(1.08)}}@media(max-width:480px){.fifi-hero{margin-left:14px;margin-right:14px;padding:14px}.fifi-hero-art{width:76px;flex-basis:76px}.fifi-hero-copy{max-width:calc(100% - 84px)}}@media(prefers-reduced-motion:reduce){.fifi-icon,.fifi-sparkle{animation:none}}
    </style>
</head>
<body>
<div class="app">
    <header>
        <a href="pertemuan3.html">← Kembali</a>
        <h1>🧑‍🎓 Absensi</h1>
        <p>Pertemuan 3 - Operasi Pengurangan Matriks</p>
    </header>
    <section class="fifi-hero fifi-hero--attendance" aria-label="Ilustrasi presensi">
        <div class="fifi-hero-copy">
            <span class="fifi-hero-title">PRESENSI PERTEMUAN 3</span>
            <p>Catat kehadiranmu untuk pertemuan ini.</p>
        </div>
        <div class="fifi-hero-art" aria-hidden="true">
            <span class="fifi-orb"></span><span class="fifi-icon">📅</span><span class="fifi-sparkle">✦</span><span class="fifi-badge">✓</span>
        </div>
    </section>
    <div class="content">
        <div class="info">
            <p><strong>Mata Pelajaran:</strong> Matematika</p>
            <p><strong>Kelas:</strong> XI SMA</p>
            <p><strong>Pertemuan:</strong> 3</p>
            <p><strong>Materi:</strong> Operasi Pengurangan Matriks</p>
        </div>
        <div class="form-group">
            <label class="title" for="nama">Nama Siswa</label>
            <input type="text" id="nama" placeholder="Masukkan nama kamu">
        </div>
        <div class="form-group">
            <label class="title">Status Kehadiran</label>
            <label class="status-option"><input type="radio" name="status" value="Hadir"><span>✅ Hadir</span></label>
            <label class="status-option"><input type="radio" name="status" value="Izin"><span>📝 Izin</span></label>
            <label class="status-option"><input type="radio" name="status" value="Sakit"><span>🤒 Sakit</span></label>
        </div>
        <button class="button" id="simpanButton" onclick="simpanAbsensi()">SIMPAN ABSENSI</button>
        <div class="message" id="message"></div>
        <a href="pertemuan3.html" class="back-button" id="backButton" style="display:none;">KEMBALI KE PERTEMUAN 3</a>
    </div>
</div>
<script type="module">
import { initializeApp } from "https://gstatic.com";
import { getFirestore, collection, addDoc } from "https://gstatic.com";

const firebaseConfig = {
  apiKey: "AIzaSyB8U4cR9yu3UoU0rc6UjRU8iG2d3ZogG",
  authDomain: "://firebaseapp.com",
  projectId: "e-learning-matematika",
  storageBucket: "e-learning-matematika.firebasestorage.app",
  messagingSenderId: "748000078584",
  appId: "1:748000078584:web:5617e49239cf4c7f6d100",
  measurementId: "G-K011W8K6Y9"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.simpanAbsensi = async function() {
    const nama = document.getElementById("nama").value.trim();
    const status = document.querySelector('input[name="status"]:checked');
    if (nama === "") { alert("Silakan masukkan nama terlebih dahulu."); return; }
    if (!status) { alert("Silakan pilih status kehadiran."); return; }

    const btn = document.getElementById("simpanButton");
    btn.disabled = true;
    btn.innerText = "MENYIMPAN...";

    const data = {
        nama: nama, status: status.value, pertemuan: 3,
        materi: "Operasi Pengurangan Matriks", waktu: new Date().toLocaleString("id-ID")
    };
    localStorage.setItem("absensiPertemuan3", JSON.stringify(data));

    try {
        await addDoc(collection(db, "data_siswa"), {
            nama: nama,
            kelas: "XI SMA",
            status: "Absensi Pertemuan 3 (Operasi Pengurangan Matriks): " + status.value,
            waktu: new Date().toISOString()
        });
        const message = document.getElementById("message");
        message.style.display = "block";
        message.innerHTML = `<strong>✅ Absensi berhasil!</strong><br><br>Nama: ${data.nama}<br>Status: ${data.status}<br>Pertemuan: ${data.pertemuan}<br>Materi: ${data.materi}<br>Waktu: ${data.waktu}`;
        document.getElementById("backButton").style.display = "block";
    } catch (error) {
        alert("Gagal menyimpan ke server: " + error.message);
    } finally {
        btn.disabled = false;
        btn.innerText = "SIMPAN ABSENSI";
    }
};
</script>
<script src="js/auth.js"></script>
</body>
</html>
