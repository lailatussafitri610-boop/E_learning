<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Matematika - E-Learning</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f6f8;
        }

        .app {
            max-width: 500px;
            min-height: 100vh;
            margin: auto;
            background: white;
            padding-bottom: 30px;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 20px;
        }

        header a {
            color: white;
            text-decoration: none;
        }

        .content {
            padding: 20px;
        }

        .meeting {
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 18px;
            margin-top: 15px;
        }

        .meeting h3 {
            margin-bottom: 8px;
        }

        .meeting p {
            color: #666;
            margin-bottom: 12px;
        }

        .button {
            display: block;
            text-align: center;
            background: #1f2937;
            color: white;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
        }

    </style>

<style id="fifi-theme-embedded">
:root{--fifi-blue-950:#214a67;--fifi-blue-900:#285b7b;--fifi-blue-700:#3b7fa8;--fifi-blue-100:#eaf4fb;--fifi-blue-50:#f8fcff;--fifi-ink:#203b52;--fifi-line:#d8e9f5}
body{background-color:var(--fifi-blue-100)!important;color:var(--fifi-ink)}.app,.container{background-color:var(--fifi-blue-50)!important}header{background-color:var(--fifi-blue-900)!important;color:#fff!important}header h1,header h2,header p{color:inherit}.card,.section,.meeting,.meeting-card,.question-box,.info,.profile-card,.info-card,.task-card,.example,.login-card,.result-card{border-color:var(--fifi-line)}.button,.btn,button,input[type=submit]{background-color:var(--fifi-blue-700);border-color:var(--fifi-blue-700);color:#fff}.button:hover,.btn:hover,button:hover,input[type=submit]:hover{background-color:var(--fifi-blue-900);border-color:var(--fifi-blue-900)}.bottom-menu{background-color:var(--fifi-blue-900)!important}
.fifi-hero{position:relative;display:flex;align-items:center;justify-content:space-between;min-height:122px;overflow:hidden;margin:14px 20px 18px;padding:16px 18px;border:1px solid #cfe4f2;border-radius:16px;background:linear-gradient(125deg,#e5f3fb,#f7fcff 60%,#d9edf9);color:var(--fifi-blue-950)}.content>.fifi-hero{margin:0 0 18px}.fifi-hero-copy{max-width:calc(100% - 108px)}.fifi-hero-title{display:block;margin:0 0 6px;color:var(--fifi-blue-900);font-size:13px;font-weight:800;letter-spacing:.07em}.fifi-hero-copy p{margin:0;color:#58758a;font-size:13px;line-height:1.5}.fifi-hero-art{position:relative;display:grid;width:94px;height:86px;flex:0 0 94px;place-items:center;pointer-events:none}.fifi-orb{position:absolute;width:70px;height:70px;border:1px solid rgba(85,152,197,.25);border-radius:50%;background:rgba(255,255,255,.75);box-shadow:0 8px 20px rgba(58,119,157,.12)}.fifi-icon{position:relative;font-size:43px;line-height:1;filter:drop-shadow(0 4px 3px rgba(47,99,131,.15));animation:fifi-float 3.6s ease-in-out infinite}.fifi-badge{position:absolute;right:4px;bottom:4px;display:grid;width:26px;height:26px;place-items:center;border:2px solid white;border-radius:50%;background:#dff1fb;color:#347fa8;font-size:15px;font-weight:800}.fifi-sparkle{position:absolute;top:4px;left:4px;color:#66a5ca;font-size:16px;animation:fifi-twinkle 2.8s ease-in-out infinite}.fifi-hero--attendance .fifi-badge{background:#e4f5eb;color:#33895d}@keyframes fifi-float{0%,100%{transform:translateY(1px)}50%{transform:translateY(-4px)}}@keyframes fifi-twinkle{0%,100%{opacity:.5;transform:scale(.9)}50%{opacity:1;transform:scale(1.08)}}@media(max-width:480px){.fifi-hero{margin-left:14px;margin-right:14px;padding:14px}.fifi-hero-art{width:76px;flex-basis:76px}.fifi-hero-copy{max-width:calc(100% - 84px)}}@media(prefers-reduced-motion:reduce){.fifi-icon,.fifi-sparkle{animation:none}}
</style></head>

<body>

<div class="app">

    <header>

        <a href="dashboard.html">
            ← Kembali
        </a>

        <h2 style="margin-top:15px;">
            📐 Matematika
        </h2>

        <p>Kelas X SMA</p>

    </header>
<section class="fifi-hero fifi-hero--subject" aria-label="Ilustrasi matematika"><div class="fifi-hero-copy"><span class="fifi-hero-title">MATEMATIKA</span><p>Jelajahi materi dan rangkaian pertemuan.</p></div><div class="fifi-hero-art" aria-hidden="true"><span class="fifi-orb"></span><span class="fifi-icon">📚</span><span class="fifi-sparkle">✦</span><span class="fifi-badge">+</span></div></section>


    <div class="content">

        <h2>Pertemuan</h2>


        <div class="meeting">

            <h3>Pertemuan 1</h3>

            <p>
                Pengertian Matriks
            </p>

            <span id="status1" style="display:block; margin:10px 0; font-weight:bold;">
    BELUM SELESAI
</span>

            <a href="pertemuan.html"
               class="button">

                MULAI

            </a>

        </div>


        <div class="meeting">

            <h3>Pertemuan 2</h3>

            <p>
                Penjumlahan Matriks
            </p>

            <span id="status2" style="display:block; margin:10px 0; font-weight:bold;">
    BELUM SELESAI
</span>

            <a href="pertemuan2.html"
               class="button" id="btnPertemuan2">

                MULAI

            </a>

        </div>


        <div class="meeting">

            <h3>Pertemuan 3</h3>

            <p>

            </p>

            <span id="status3" style="display:block; margin:10px 0; font-weight:bold;">
    BELUM SELESAI
</span>

            <a href="pertemuan3.html"
               class="button" id="btnPertemuan3">

                MULAI

            </a>

        </div>

    </div>

</div>

<script>
    function cekStatusPertemuan() {

        // =========================
        // PERTEMUAN 1
        // =========================
        const selesai1 =
            localStorage.getItem("absensiPertemuan1") &&
            localStorage.getItem("tugasPertemuan1") &&
            localStorage.getItem("quizPertemuan1");

        const status1 = document.getElementById("status1");

        if (selesai1) {
            status1.textContent = "✓ SELESAI";
            status1.style.color = "green";
        } else {
            status1.textContent = "BELUM SELESAI";
            status1.style.color = "#777";
        }


        // =========================
        // PERTEMUAN 2
        // =========================
        const selesai2 =
            localStorage.getItem("absensiPertemuan2") &&
            localStorage.getItem("tugasPertemuan2") &&
            localStorage.getItem("quizPertemuan2");

        const status2 = document.getElementById("status2");

        if (selesai2) {
            status2.textContent = "✓ SELESAI";
            status2.style.color = "green";
        } else {
            status2.textContent = "BELUM SELESAI";
            status2.style.color = "#777";
        }


        // =========================
        // PERTEMUAN 3
        // =========================
        const selesai3 =
            localStorage.getItem("absensiPertemuan3") &&
            localStorage.getItem("tugasPertemuan3") &&
            localStorage.getItem("quizPertemuan3");

        const status3 = document.getElementById("status3");

        if (selesai3) {
            status3.textContent = "✓ SELESAI";
            status3.style.color = "green";
        } else {
            status3.textContent = "BELUM SELESAI";
            status3.style.color = "#777";
        }
    }

    cekStatusPertemuan();
</script>

<script>
    function cekAksesPertemuan() {

        // Cek apakah Pertemuan 1 sudah selesai
        const selesai1 =
            localStorage.getItem("absensiPertemuan1") &&
            localStorage.getItem("tugasPertemuan1") &&
            localStorage.getItem("quizPertemuan1");

        // Cek apakah Pertemuan 2 sudah selesai
        const selesai2 =
            localStorage.getItem("absensiPertemuan2") &&
            localStorage.getItem("tugasPertemuan2") &&
            localStorage.getItem("quizPertemuan2");


        // =========================
        // AKSES PERTEMUAN 2
        // =========================

        const btn2 = document.getElementById("btnPertemuan2");

        (!selesai1) {
            btn2.textContent = "🔒 TERKUNCI";

            btn2.style.background = "#9ca3af";

            btn2.onclick = function(event) {
                event.preventDefault();
                alert("Selesaikan Pertemuan 1 terlebih dahulu.");
            };
        }


        // =========================
        // AKSES PERTEMUAN 3
        // =========================

        const btn3 = document.getElementById("btnPertemuan3");

        (!selesai2) {
            btn3.textContent = "🔒 TERKUNCI";

            btn3.style.background = "#9ca3af";

            btn3.onclick = function(event) {
                event.preventDefault();
                alert("Selesaikan Pertemuan 2 terlebih dahulu.");
            };
        }
    }

    cekAksesPertemuan();
</script>

</body>

</html>
