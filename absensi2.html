
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Absensi - E-Learning SMA</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            color: #222;
        }

        .app {
            max-width: 500px;
            min-height: 100vh;
            margin: auto;
            background: white;
            padding-bottom: 30px;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 20px;
        }

        header a {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }

        header h1 {
            margin-top: 20px;
            font-size: 25px;
        }

        header p {
            margin-top: 8px;
            color: #d1d5db;
        }

        .content {
            padding: 20px;
        }

        .info {
            background: #f9fafb;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .info p {
            margin-bottom: 7px;
            line-height: 1.5;
        }

        .info p:last-child {
            margin-bottom: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label.title {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 9px;
            font-size: 16px;
        }

        .status-option {
            display: flex;
            align-items: center;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .status-option input {
            margin-right: 12px;
            width: 18px;
            height: 18px;
        }

        .status-option:hover {
            background: #f9fafb;
        }

        .button {
            width: 100%;
            border: none;
            background: #1f2937;
            color: white;
            padding: 14px;
            border-radius: 9px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        .button:hover {
            background: #111827;
        }

        .message {
            display: none;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #166534;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            line-height: 1.5;
        }
    </style>

    <style id="fifi-theme-embedded">
        :root {
            --fifi-blue-950: #214a67;
            --fifi-blue-900: #285b7b;
            --fifi-blue-700: #3b7fa8;
            --fifi-blue-100: #eaf4fb;
            --fifi-blue-50: #f8fcff;
            --fifi-ink: #203b52;
            --fifi-line: #d8e9f5;
        }

        body {
            background-color: var(--fifi-blue-100) !important;
            color: var(--fifi-ink);
        }

        .app {
            background-color: var(--fifi-blue-50) !important;
        }

        header {
            background-color: var(--fifi-blue-900) !important;
            color: #fff !important;
        }

        header h1,
        header p {
            color: inherit;
        }

        .info {
            border-color: var(--fifi-line);
        }

        .button,
        button {
            background-color: var(--fifi-blue-700);
            border-color: var(--fifi-blue-700);
            color: #fff;
        }

        .button:hover,
        button:hover {
            background-color: var(--fifi-blue-900);
            border-color: var(--fifi-blue-900);
        }

        .fifi-hero {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 122px;
            overflow: hidden;
            margin: 14px 20px 18px;
            padding: 16px 18px;
            border: 1px solid #cfe4f2;
            border-radius: 16px;
            background: linear-gradient(
                125deg,
                #e5f3fb,
                #f7fcff 60%,
                #d9edf9
            );
            color: var(--fifi-blue-950);
        }

        .fifi-hero-copy {
            max-width: calc(100% - 108px);
        }

        .fifi-hero-title {
            display: block;
            margin: 0 0 6px;
            color: var(--fifi-blue-900);
            font-size: 13px;
            font-weight: 800;
            letter-spacing: .07em;
        }

        .fifi-hero-copy p {
            margin: 0;
            color: #58758a;
            font-size: 13px;
            line-height: 1.5;
        }

        .fifi-hero-art {
            position: relative;
            display: grid;
            width: 94px;
            height: 86px;
            flex: 0 0 94px;
            place-items: center;
            pointer-events: none;
        }

        .fifi-orb {
            position: absolute;
            width: 70px;
            height: 70px;
            border: 1px solid rgba(85,152,197,.25);
            border-radius: 50%;
            background: rgba(255,255,255,.75);
            box-shadow: 0 8px 20px rgba(58,119,157,.12);
        }

        .fifi-icon {
            position: relative;
            font-size: 43px;
            line-height: 1;
            filter: drop-shadow(0 4px 3px rgba(47,99,131,.15));
            animation: fifi-float 3.6s ease-in-out infinite;
        }

        .fifi-badge {
            position: absolute;
            right: 4px;
            bottom: 4px;
            display: grid;
            width: 26px;
            height: 26px;
            place-items: center;
            border: 2px solid white;
            border-radius: 50%;
            background: #e4f5eb;
            color: #33895d;
            font-size: 15px;
            font-weight: 800;
        }

        .fifi-sparkle {
            position: absolute;
            top: 4px;
            left: 4px;
            color: #66a5ca;
            font-size: 16px;
            animation: fifi-twinkle 2.8s ease-in-out infinite;
        }

        @keyframes fifi-float {
            0%, 100% {
                transform: translateY(1px);
            }

            50% {
                transform: translateY(-4px);
            }
        }

        @keyframes fifi-twinkle {
            0%, 100% {
                opacity: .5;
                transform: scale(.9);
            }

            50% {
                opacity: 1;
                transform: scale(1.08);
            }
        }

        @media(max-width:480px) {
            .fifi-hero {
                margin-left: 14px;
                margin-right: 14px;
                padding: 14px;
            }

            .fifi-hero-art {
                width: 76px;
                flex-basis: 76px;
            }

            .fifi-hero-copy {
                max-width: calc(100% - 84px);
            }
        }

        @media(prefers-reduced-motion:reduce) {
            .fifi-icon,
            .fifi-sparkle {
                animation: none;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <header>

        <a href="pertemuan2.html">
            ← Kembali
        </a>

        <h1>
            🧑‍🎓 Absensi
        </h1>

        <p>
            Pertemuan 2 - Penjumlahan Matriks
        </p>

    </header>

    <!-- HERO -->

    <section class="fifi-hero fifi-hero--attendance"
        aria-label="Ilustrasi presensi">

        <div class="fifi-hero-copy">

            <span class="fifi-hero-title">
                PRESENSI PERTEMUAN 2
            </span>

            <p>
                Catat kehadiranmu untuk pertemuan ini.
            </p>

        </div>

        <div class="fifi-hero-art" aria-hidden="true">

            <span class="fifi-orb"></span>

            <span class="fifi-icon">📅</span>

            <span class="fifi-sparkle">✦</span>

            <span class="fifi-badge">✓</span>

        </div>

    </section>

    <div class="content">

        <!-- INFORMASI -->

        <div class="info">

            <p>
                <strong>Mata Pelajaran:</strong>
                Matematika
            </p>

            <p>
                <strong>Kelas:</strong>
                XI SMA
            </p>

            <p>
                <strong>Pertemuan:</strong>
                2
            </p>

            <p>
                <strong>Materi:</strong>
                Penjumlahan Matriks
            </p>

        </div>

        <!-- NAMA -->

        <div class="form-group">

            <label class="title" for="nama">
                Nama Siswa
            </label>

            <input
                type="text"
                id="nama"
                placeholder="Masukkan nama kamu"
            >

        </div>

        <!-- STATUS -->

        <div class="form-group">

            <label class="title">
                Status Kehadiran
            </label>

            <label class="status-option">

                <input
                    type="radio"
                    name="status"
                    value="Hadir"
                >

                <span>
                    ✅ Hadir
                </span>

            </label>

            <label class="status-option">

                <input
                    type="radio"
                    name="status"
                    value="Izin"
                >

                <span>
                    📝 Izin
                </span>

            </label>

            <label class="status-option">

                <input
                    type="radio"
                    name="status"
                    value="Sakit"
                >

                <span>
                    🤒 Sakit
                </span>

            </label>

        </div>

        <!-- BUTTON -->

        <button
            class="button"
            onclick="simpanAbsensi()"
        >
            SIMPAN ABSENSI
        </button>

        <!-- MESSAGE -->

        <div
            class="message"
            id="message"
        ></div>

    </div>

</div>

<script>

function simpanAbsensi() {

    const nama =
        document.getElementById("nama").value.trim();

    const status =
        document.querySelector(
            'input[name="status"]:checked'
        );

    // Periksa nama

    if (nama === "") {

        alert("Silakan masukkan nama terlebih dahulu.");

        return;

    }

    // Periksa status

    if (!status) {

        alert("Silakan pilih status kehadiran.");

        return;

    }

    // Simpan data absensi

    const dataAbsensi = {

        nama: nama,

        status: status.value,

        pertemuan: 2,

        materi: "Penjumlahan Matriks",

        waktu: new Date().toLocaleString("id-ID")

    };

    localStorage.setItem(
        "absensiPertemuan2",
        JSON.stringify(dataAbsensi)
    );

    // Tampilkan pesan

    const message =
        document.getElementById("message");

    message.style.display = "block";

    message.innerHTML = `
        <strong>✅ Absensi berhasil!</strong>
        <br><br>
        Nama: ${nama}
        <br>
        Status: ${status.value}
        <br>
        Pertemuan: 2
    `;

}

</script>

<script src="js/auth.js"></script>

</body>
</html>
