        .subtitle {
            color: #777;

        .info {

        }

        .radio-option input {

        button {

            border: none;
            background: #1f2937;
            color: white;
            padding: 14px;
            border-radius: 9px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .success {
            display: none;
            background: #f0fdf4;
            border-left: 4px solid #16a34a;
            padding: 18px;
            border-radius: 8px;
            margin-top: 20px;
            line-height: 1.7;
            font-size: 14px;
        }
    </style>

<body>
<section class="fifi-hero fifi-hero--attendance" aria-label="Ilustrasi presensi"><div class="fifi-hero-copy"><span class="fifi-hero-title">PRESENSI PERTEMUAN 2</span><p>Catat kehadiranmu untuk pertemuan ini.</p></div><div class="fifi-hero-art" aria-hidden="true"><span class="fifi-orb"></span><span class="fifi-icon">📅</span><span class="fifi-sparkle">✦</span><span class="fifi-badge">✓</span></div></section>

<div class="container">

    <a href="pertemuan2.html" class="back">
        ← Kembali ke Pertemuan 2
    </a>

    <h1>Absensi</h1>

    <p class="subtitle">
        Pertemuan 2 — Penjumlahan Matriks
    </p>


    <div class="info">

        <strong>Mata Pelajaran:</strong> Matematika<br>

        <strong>Kelas:</strong> XI SMA<br>

        <strong>Pertemuan:</strong> 2<br>

        <strong>Materi:</strong> Penjumlahan Matriks

    </div>


    <div class="form-box">

        <form id="absensiForm">

            <label class="title">
                Nama Lengkap
            </label>

            <input
                type="text"
                id="nama"
                placeholder="Masukkan nama lengkap"
            >


            <div class="status">

                <label class="title">
                    Status Kehadiran
                </label>


                <label class="radio-option">

                    <input
                        type="radio"
                        name="status"
                        value="Hadir"
                    >

                    Hadir

                </label>


                <label class="radio-option">

                    <input
                        type="radio"
                        name="status"
                        value="Izin"
                    >

                    Izin

                </label>


                <label class="radio-option">

                    <input
                        type="radio"
                        name="status"
                        value="Sakit"
                    >

                    Sakit

                </label>

            </div>


            <button type="submit">
                SIMPAN ABSENSI
            </button>

        </form>


        <div class="success" id="success">

            ✅ <strong>Absensi berhasil disimpan!</strong>

            <br><br>

            Nama: <span id="hasilNama"></span>

            <br>

            Status: <span id="hasilStatus"></span>

            <br>

            Pertemuan: 2

        </div>

    </div>

</div>


<script>

    document.getElementById("absensiForm").addEventListener(
        "submit",
        function(event) {

            event.preventDefault();


            const nama =
                document.getElementById("nama").value.trim();


            const status =
                document.querySelector(
                    'input[name="status"]:checked'
                );


            if (nama === "") {

                alert("Silakan masukkan nama lengkap.");

                return;

            }


            if (!status) {

                alert("Silakan pilih status kehadiran.");

                return;

            }


            const dataAbsensi = {

                nama: nama,

                status: status.value,

                pertemuan: 2,

                materi: "Pertidaksamaan Linear",

                waktu: new Date().toLocaleString("id-ID")

            };


            localStorage.setItem(
                "absensiPertemuan2",
                JSON.stringify(dataAbsensi)
            );


            document.getElementById("hasilNama").textContent =
                nama;


            document.getElementById("hasilStatus").textContent =
                status.value;


            document.getElementById("success").style.display =
                "block";


            document.getElementById("absensiForm").style.display =
                "none";

        }
    );

</script>
<script src="js/auth.js"></script>
</body>
